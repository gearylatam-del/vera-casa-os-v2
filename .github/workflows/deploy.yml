name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Aynı anda birden fazla deploy yarışmasın: yeni push gelince
# önceki devam eden deploy iptal edilir, son commit kazanır.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            SHOPIFY_CLIENT_SECRET
            VERA_TOKEN
        env:
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          VERA_TOKEN: ${{ secrets.VERA_TOKEN }}
